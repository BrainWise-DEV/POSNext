
name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-pos_next-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    # Pinned: ubuntu-latest (26.04) ships mariadb-client 11.8, which requires
    # SSL by default and cannot talk to the mariadb:10.6 service container.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: core
            satellites: false
          # Installs the satellite apps too and migrates twice: proves the rollout
          # gate (a before_migrate hook) passes on compatible branches and that
          # migrate is idempotent.
          - leg: with-satellites
            satellites: true
    name: Server (${{ matrix.leg }})

    env:
      # Compatible satellite branches; a repo variable overrides them.
      PROMOTIONS_REF: ${{ vars.PROMOTIONS_REF || 'feature/friends-family-fixes' }}
      MAGENTO_REF: ${{ vars.MAGENTO_REF || 'feature/friends-family-magento-otp' }}

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Run Frontend Tests
        if: matrix.leg == 'core'
        working-directory: POS
        run: yarn install --frozen-lockfile && yarn test:run

      - name: Install MariaDB Client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-branch version-15 ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app erpnext --branch version-15
          bench get-app pos_next $GITHUB_WORKSPACE
          if [ "${{ matrix.satellites }}" = "true" ]; then
            bench get-app posnext_promotions --branch "$PROMOTIONS_REF" --skip-assets https://github.com/BrainWise-DEV/Promotions
            bench get-app magento_integration --branch "$MAGENTO_REF" --skip-assets https://github.com/BrainWise-DEV/magento_integration
          fi
          bench setup requirements --dev
          uv pip install 'setuptools>=71,<82' --python env/bin/python
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app pos_next
          if [ "${{ matrix.satellites }}" = "true" ]; then
            bench --site test_site install-app posnext_promotions magento_integration
          fi
          bench build
        env:
          CI: 'Yes'

      # Twice: the first run exercises the version gate (before_migrate hook) and the
      # patches, the second proves they are idempotent.
      - name: Migrate twice (gates and patch idempotency)
        if: matrix.satellites
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site migrate
          bench --site test_site migrate

      - name: Run Promotion Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --module pos_next.test_promotions
          bench --site test_site run-tests --module pos_next.api.test_credit_linked_returns
        env:
          TYPE: server

      - name: Run Sales Person Commission Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site run-tests --module pos_next.pos_next.utils.tests.test_sales_person_commission
          bench --site test_site run-tests --module pos_next.pos_next.utils.tests.test_pos_sales_team_resolution
          bench --site test_site run-tests --module pos_next.pos_next.utils.tests.test_sales_person_commission_hook
        env:
          TYPE: server

      - name: Run Translation Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site run-tests --module pos_next.test_ar_translations
          bench --site test_site run-tests --module pos_next.api.test_localization
        env:
          TYPE: server

      - name: Run Friends & Family Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --module pos_next.api.test_email_verification
          bench --site test_site run-tests --module pos_next.integrations.test_otp_registry
          bench --site test_site run-tests --module pos_next.integrations.test_otp_frappe_email
          bench --site test_site run-tests --module pos_next.integrations.test_benefit_registry
          bench --site test_site run-tests --module pos_next.integrations.test_contract_gate
          bench --site test_site run-tests --module pos_next.test_no_promotions_import
          bench --site test_site run-tests --module pos_next.pos_next.doctype.pos_settings.test_pos_settings_verification
          bench --site test_site run-tests --module pos_next.api.test_return_safety
          bench --site test_site run-tests --module pos_next.api.test_coupon_usage
          bench --site test_site run-tests --module pos_next.api.test_verified_email_unique
          bench --site test_site run-tests --module pos_next.api.test_security_hardening
        env:
          TYPE: server

      # One-time offers and paid-row discounts with promotions' F&F rate (Rulings 120, 123).
      - name: Run One-Time Offer and Discount Enforcement Tests (with satellites)
        if: matrix.satellites
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --module pos_next.api.test_one_time_offer
          bench --site test_site run-tests --module pos_next.api.test_discount_enforcement
        env:
          TYPE: server
