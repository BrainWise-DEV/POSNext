<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%234F46E5' d='M20 7h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v3H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zM10 4h4v3h-4V4zm10 16H4V9h16v11z'/></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="theme-color" content="#4F46E5" />
  <meta name="description" content="POS built on ERPNext with real-time billing, stock management, multi-user access, offline mode, and direct ERP integration" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="POSNext" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%234F46E5' d='M20 7h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v3H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zM10 4h4v3h-4V4zm10 16H4V9h16v11z'/></svg>" />
  <title>POSNext</title>
  <!-- Frappe rewrites this placeholder per session, outside the page cache, so the
       CSRF token is on the page at first paint instead of arriving over the network
       once the SPA has booted. Anything posting before that would be refused. -->
  <script>window.frappe = window.frappe || {};</script>
  <!-- csrf_token -->
  <script>window.csrf_token = window.csrf_token || window.frappe.csrf_token;</script>
  <!-- Nexus demo banner + guided journey. ?v= busts the 12h asset cache on deploy. -->
  <link rel="stylesheet" href="/assets/nexus_demo/css/demo_countdown_banner.bundle.css?v={{ build_version }}" onerror="this.remove()" />
  <script defer src="/assets/nexus_demo/js/demo_countdown_banner.bundle.js?v={{ build_version }}" onerror="this.remove()"></script>
  <link rel="stylesheet" href="/assets/nexus_demo/css/demo_journey.bundle.css?v={{ build_version }}" onerror="this.remove()" />
  <script defer src="/assets/nexus_demo/js/demo_journey.bundle.js?v={{ build_version }}" onerror="this.remove()"></script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
