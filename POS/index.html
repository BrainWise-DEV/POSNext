<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%234F46E5' d='M20 7h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v3H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zM10 4h4v3h-4V4zm10 16H4V9h16v11z'/></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="theme-color" content="#4F46E5" />
  <meta name="description" content="POS built on ERPNext with real-time billing, stock management, multi-user access, offline mode, and direct ERP integration" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="POSNext" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%234F46E5' d='M20 7h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v3H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zM10 4h4v3h-4V4zm10 16H4V9h16v11z'/></svg>" />
  <title>POSNext</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>

  <!--
    Nexus demo countdown banner, when that app is installed.

    Loaded through bundled_asset() so the URL carries the build hash, the same
    way the Desk loads it. The previous fixed /assets/nexus_demo/... path never
    changed, and Frappe serves it with a 12-hour max-age, so a browser that had
    already opened POS kept running the old banner for half a day after a
    deploy — including the release that added the role switcher.

    include_style() picks the mirrored css-rtl build for an Arabic session, the
    same one the Desk has been serving all along.

    Jinja goes here and not in <head>: vite parses the head, and loose text
    there is liable to be relocated into the body, which would split these tags
    from the conditional that guards them. Note that Jinja reads inside HTML
    comments too, so this one keeps clear of its delimiters.
  -->
  {% set ndcb = bundled_asset('demo_countdown_banner.bundle.js') %}
  {% if ndcb.startswith('/assets/nexus_demo/') %}
  {{ include_style('demo_countdown_banner.bundle.css') }}
  {{ include_script('demo_countdown_banner.bundle.js') }}
  {% endif %}
</body>

</html>
